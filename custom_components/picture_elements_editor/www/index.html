<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Floorplan Editor</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100vh;
      width: 100vw;
      background: #121214;
      overflow: hidden;
      font-family: Roboto, sans-serif;
    }
    picture-elements-editor {
      width: 100%;
      height: 100vh;
      display: flex;
    }
  </style>
  <script type="module" src="./picture-elements-editor.js"></script>
</head>
<body>
  <picture-elements-editor ispanel></picture-elements-editor>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const editor = document.querySelector('picture-elements-editor');
      try {
        if (window.parent && window.parent.document) {
          const ha = window.parent.document.querySelector('home-assistant');
          if (ha && ha.hass) {
            editor.hass = ha.hass;
          }
        }
      } catch (e) {
        console.log('Standalone mode');
      }
    });
  </script>
</body>
</html>
